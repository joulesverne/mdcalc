<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdcalc</title>
<style>
  /*
   * Layout mirrors the desktop build: one editable text area, with each
   * line's result drawn in grey in a fixed-width strip along the right
   * edge. The strip is a separate, non-interactive element layered over
   * the textarea -- results are never inserted into the textarea's value,
   * so what you edit is only ever what you typed.
   *
   * Alignment is not computed anywhere: the results strip is a single
   * pre-formatted text block sharing the textarea's font-size, line-height
   * and top padding, so line N of the strip lands at line N of the text on
   * its own. That is why these values live in variables used by both.
   */
  :root {
    --font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --font-size: 13px;
    --line-height: 20px;
    --pad: 8px;
    --gutter: 110px;          /* matches GUTTER_WIDTH in the desktop build */
    --result-fg: #999;
    --surface: #fff;
    --text: #000;
    --chrome: #f4f4f4;
    --border: #ddd;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--surface);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }

  body { display: flex; flex-direction: column; }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: var(--chrome);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  header button {
    font: inherit;
    padding: 3px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
  }

  header button:hover { background: #eaeaea; }

  .editor { position: relative; flex: 1; min-height: 0; }

  /* The two elements whose metrics must agree for results to line up. */
  #input, #results-rows {
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: var(--line-height);
  }

  #input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: var(--pad);
    /* Keep typed text clear of the results strip rather than letting the
       two overlap the way the desktop build can. */
    padding-right: calc(var(--gutter) + var(--pad));
    border: 0;
    outline: none;
    resize: none;
    overflow: auto;
    white-space: pre;         /* no wrapping: one document line == one row */
    background: var(--surface);
    color: var(--text);
  }

  #results {
    position: absolute;
    top: 0;
    right: 0;                 /* nudged left by any scrollbar width, in app.js */
    bottom: 0;
    width: calc(var(--gutter) + var(--pad));
    overflow: hidden;
    pointer-events: none;     /* clicks and selection pass through to the text */
    background: var(--surface); /* hides any long line running underneath */
  }

  #results-rows {
    padding-top: var(--pad);  /* same first-line offset as the textarea */
    padding-right: var(--pad);
    white-space: pre;         /* one line per document line, blanks included */
    text-align: right;
    color: var(--result-fg);
  }
</style>
</head>
<body>
  <header>
    <button id="clear-button" type="button">Clear</button>
    <button id="open-button" type="button">Open…</button>
    <button id="save-button" type="button">Save</button>
    <input id="file-picker" type="file" accept=".md,.txt,.calc,text/plain,text/markdown" hidden>
  </header>

  <main class="editor">
    <textarea id="input" spellcheck="false" autocomplete="off"
              autocapitalize="off" autocorrect="off" wrap="off"></textarea>
    <!-- aria-hidden: results are decorative echoes of the text being edited,
         and reading them between every line would make the editor unusable
         with a screen reader. -->
    <div id="results" aria-hidden="true"><div id="results-rows"></div></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
